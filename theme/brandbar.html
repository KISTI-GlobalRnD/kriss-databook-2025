<div class="kriss-brandbar" role="contentinfo" aria-label="과제 제공 및 수행 기관">
  <div class="kriss-brandbar-inner">
    <div class="kriss-brandbar-group">
      <div class="kriss-brandbar-label">과제 제공/수행 기관</div>
      <div class="kriss-brandbar-logos">
        <a
          class="kriss-brandbar-logo"
          href="https://www.kriss.re.kr/"
          target="_blank"
          rel="noopener"
          aria-label="KRISS 한국표준과학연구원"
        >
          <img data-kriss-src="img/ci3_3_2.png" alt="KRISS" loading="eager" />
        </a>
        <a
          class="kriss-brandbar-logo"
          href="https://www.kisti.re.kr/"
          target="_blank"
          rel="noopener"
          aria-label="KISTI 한국과학기술정보연구원"
        >
          <img data-kriss-src="img/KORE2.png" alt="KISTI" loading="eager" />
        </a>
      </div>
    </div>
    <div class="kriss-brandbar-counter" aria-label="사이트 조회 수">
      <span class="kriss-brandbar-counter-label">조회</span>
      <img
        src="https://hitscounter.dev/api/hit?url=https%3A%2F%2Fkisti-globalrnd.github.io%2Fkriss-databook-2025%2F&amp;label=Visits&amp;icon=eye-fill&amp;color=%23206bb5"
        alt="사이트 조회수 배지"
        loading="eager"
      />
    </div>
  </div>
</div>

<script>
  (() => {
    const offset =
      document.querySelector('meta[name="quarto:offset"]')?.content ?? "./";
    document.querySelectorAll("img[data-kriss-src]").forEach((img) => {
      const rel = img.getAttribute("data-kriss-src");
      if (!rel) return;
      img.setAttribute("src", `${offset}${rel}`);
    });
  })();
</script>
