project:
  type: book
  output-dir: _site_book
  render:
    - index.qmd
    - book_part1_landscape.qmd
    - book_part2_capability.qmd
    - book_part3_emerging.qmd
    - docs/keyword_trends.qmd
    - docs/vosviewer_explorer.qmd
    - docs/cluster_dashboard.qmd
    - docs/appendix_detailed_reporting.qmd
    - docs/appendix_methodology.qmd
    - docs/appendix_core_reports.qmd
    - docs/appendix_expand_reports.qmd
    - docs/appendix_gap_reports.qmd
    - docs/detailed_reports/*/report.qmd
    - docs/appendix.qmd
  resources:
    - docs/assets/**
    - "Final_Report_MD/최종보고서 내용/*.png"
    - "Final_Report_MD/최종보고서 내용/*.xlsx"
    - theme/**

filters:
  - filters/fix_single_quotes.lua

book:
  title: "KRISS 표준과학 연구 데이터북 (Book)"
  date-format: iso
  repo-url: "https://github.com/KISTI-GlobalRnD/kriss-databook-2025"
  repo-actions: [source, issue]
  sidebar:
    style: floating
    search: true
    collapse-level: 3
    tools:
      - icon: browser
        text: "웹 버전 보기"
        href: "https://kisti-globalrnd.github.io/kriss-databook-2025/"
      - icon: book
        text: "북 버전 홈"
        href: "https://kisti-globalrnd.github.io/kriss-databook-2025/book/"
  navbar:
    left:
      - text: "홈 / Home"
        href: "https://kisti-globalrnd.github.io/kriss-databook-2025/"
      - text: "데이터북 / Databook"
        menu:
          - text: "서문 / Preface"
            href: "https://kisti-globalrnd.github.io/kriss-databook-2025/book/index.html"
          - text: "문헌 집합 및 연구지형도 구축"
            href: "https://kisti-globalrnd.github.io/kriss-databook-2025/book/part-1-landscape.html"
          - text: "기관 연구역량 진단"
            href: "https://kisti-globalrnd.github.io/kriss-databook-2025/book/part-2-capability.html"
          - text: "유망 연구영역 도출"
            href: "https://kisti-globalrnd.github.io/kriss-databook-2025/book/part-3-emerging.html"
      - text: "인터랙티브 도구 / Tools"
        menu:
          - text: "키워드 추세 탐색기 / Keyword Trends"
            href: "https://kisti-globalrnd.github.io/kriss-databook-2025/docs/keyword_trends.html"
          - text: "연구지형도(인터랙티브 맵) / VOSviewer"
            href: "https://kisti-globalrnd.github.io/kriss-databook-2025/docs/vosviewer_explorer.html"
          - text: "클러스터 대시보드 (Shiny)"
            href: "https://kisti-globalrnd.github.io/kriss-databook-2025/docs/cluster_dashboard.html"
      - text: "부록 / Appendix"
        menu:
          - text: "상세 리포팅 방법론"
            href: "https://kisti-globalrnd.github.io/kriss-databook-2025/docs/appendix_detailed_reporting.html"
          - text: "클러스터링·키워드 방법론"
            href: "https://kisti-globalrnd.github.io/kriss-databook-2025/docs/appendix_methodology.html"
          - text: "상세 리포팅 — 핵심 역량"
            href: "https://kisti-globalrnd.github.io/kriss-databook-2025/docs/appendix_core_reports.html"
          - text: "상세 리포팅 — 확장 가능"
            href: "https://kisti-globalrnd.github.io/kriss-databook-2025/docs/appendix_expand_reports.html"
          - text: "상세 리포팅 — 역량 공백"
            href: "https://kisti-globalrnd.github.io/kriss-databook-2025/docs/appendix_gap_reports.html"
          - text: "용어 및 참고 / Glossary"
            href: "https://kisti-globalrnd.github.io/kriss-databook-2025/docs/appendix.html"
  chapters:
    - index.qmd
    - book_part1_landscape.qmd
    - book_part2_capability.qmd
    - book_part3_emerging.qmd
  appendices:
    - docs/appendix_detailed_reporting.qmd
    - docs/appendix_methodology.qmd
    - part: "상세 리포트 — 핵심 역량"
      chapters:
        - docs/appendix_core_reports.qmd
        - docs/detailed_reports/cluster_12/report.qmd
        - docs/detailed_reports/cluster_173/report.qmd
        - docs/detailed_reports/cluster_24/report.qmd
        - docs/detailed_reports/cluster_167/report.qmd
        - docs/detailed_reports/cluster_182/report.qmd
        - docs/detailed_reports/cluster_69/report.qmd
        - docs/detailed_reports/cluster_77/report.qmd
        - docs/detailed_reports/cluster_145/report.qmd
        - docs/detailed_reports/cluster_127/report.qmd
        - docs/detailed_reports/cluster_178/report.qmd
    - part: "상세 리포트 — 확장 가능"
      chapters:
        - docs/appendix_expand_reports.qmd
        - docs/detailed_reports/cluster_117/report.qmd
        - docs/detailed_reports/cluster_154/report.qmd
        - docs/detailed_reports/cluster_191/report.qmd
        - docs/detailed_reports/cluster_15/report.qmd
        - docs/detailed_reports/cluster_123/report.qmd
        - docs/detailed_reports/cluster_176/report.qmd
        - docs/detailed_reports/cluster_79/report.qmd
        - docs/detailed_reports/cluster_84/report.qmd
        - docs/detailed_reports/cluster_107/report.qmd
        - docs/detailed_reports/cluster_141/report.qmd
    - part: "상세 리포트 — 역량 공백"
      chapters:
        - docs/appendix_gap_reports.qmd
        - docs/detailed_reports/cluster_189/report.qmd
        - docs/detailed_reports/cluster_159/report.qmd
        - docs/detailed_reports/cluster_112/report.qmd
        - docs/detailed_reports/cluster_133/report.qmd
        - docs/detailed_reports/cluster_131/report.qmd
        - docs/detailed_reports/cluster_179/report.qmd
        - docs/detailed_reports/cluster_169/report.qmd
        - docs/detailed_reports/cluster_62/report.qmd
        - docs/detailed_reports/cluster_162/report.qmd
        - docs/detailed_reports/cluster_125/report.qmd
    - docs/appendix.qmd

language:
  section-title-footnotes: "각주"
  section-title-references: "참고문헌"

crossref:
  fig-title: "그림"
  tbl-title: "표"
  fig-prefix: 그림
  tbl-prefix: 표
  ref-hyperlink: true

format:
  html:
    theme: [pulse, theme/my_theme.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    code-copy: true
    anchor-sections: true
    fig-responsive: true
    lightbox: true
    html-math-method:
      method: mathjax
      options:
        tags: all
    include-in-header:
      - text: |
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-datatables@9.0.0/dist/style.css" />
          <script src="https://cdn.jsdelivr.net/npm/simple-datatables@9.0.0" defer></script>
          <script src="docs/assets/js/datatable-init.js" defer></script>
