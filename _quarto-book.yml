project:
  type: book
  output-dir: _site_book
  render:
    - index.qmd
    - docs/*.qmd
    - "!docs/final_report_*.qmd"
  resources:
    - "Final_Report_MD/최종보고서 내용/*.png"
    - "Final_Report_MD/최종보고서 내용/*.xlsx"

book:
  title: "KRISS Keyword Pipeline Report (Book)"
  date-format: iso
  sidebar:
    style: floating
    search: true
    collapse-level: 2
    tools:
      - icon: browser
        text: "웹 버전 보기"
        href: "https://kisti-globalrnd.github.io/kriss-databook-2025/website/"
      - icon: book
        text: "북 버전 홈"
        href: "https://kisti-globalrnd.github.io/kriss-databook-2025/book/"
  chapters:
    - index.qmd
    - docs/authoring_notes.qmd
    - part: "최종보고서 (Notion import)"
      chapters:
        - docs/report_00_preface.qmd
        - docs/report_1_1_data_build.qmd
        - docs/report_1_2_1_global_landscape.qmd
        - docs/report_1_2_2_leiden_clustering.qmd
        - docs/report_1_2_3_kriss_division_mapping.qmd
        - docs/report_1_2_4_keywords_timeseries.qmd
        - docs/keyword_trends.qmd
        - docs/report_1_2_5_landscape_visualization.qmd
        - docs/report_2_1_org_country_standardization.qmd
        - docs/report_2_2_benchmark_institutions.qmd
        - docs/report_2_3_collaboration_network.qmd
        - docs/report_2_4_1_country_performance.qmd
        - docs/report_2_4_2_institution_performance.qmd
        - docs/report_2_4_3_policy_alignment.qmd
        - docs/report_3_1_portfolio_capability.qmd
        - docs/report_3_2_emerging_candidates.qmd
        - docs/report_3_3_1_emergence_indicators.qmd
        - docs/report_3_3_2_emergence_scoring.qmd
        - docs/report_3_4_databook_dashboard.qmd
        - docs/report_3_5_llm_reporting.qmd
    - docs/research_overview.qmd
    - docs/strategy_execution.qmd
    - part: "데이터 & 방법론"
      chapters:
        - docs/data_architecture.qmd
        - docs/pipeline_architecture.qmd
        - docs/algorithmic_scoring.qmd
        - docs/configuration.qmd
    - part: "도메인 연구지형도"
      chapters:
        - docs/module_domain_map.qmd
    - part: "기관 성과 & 포트폴리오"
      chapters:
        - docs/module_institutional.qmd
    - part: "운영 & 일정"
      chapters:
        - docs/delivery_plan.qmd
        - docs/operations.qmd
    - part: "Diagnostics & Appendix"
      chapters:
        - docs/diagnostics.qmd
        - docs/appendix.qmd
        - docs/change_log.qmd

language:
  section-title-footnotes: "각주"
  section-title-references: "참고문헌"

crossref:
  fig-title: "그림"
  tbl-title: "표"
  fig-prefix: 그림
  tbl-prefix: 표
  ref-hyperlink: true

format:
  html:
    theme: [pulse, theme/my_theme.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 2
    code-copy: true
    anchor-sections: true
    fig-responsive: true
