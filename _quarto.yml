crossref:
  fig-title: "그림"
  tbl-title: "표"
  fig-prefix: 그림
  tbl-prefix: 표
  ref-hyperlink: true

format:
  html:
    theme: [cosmo, theme/my_theme.scss]
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    anchor-sections: true
    lightbox: true
    html-math-method:
      method: mathjax
      options:
        tags: all
    include-before-body:
      - theme/brandbar.html
    include-in-header:
      - text: |
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-datatables@9.0.0/dist/style.css" />
          <script src="https://cdn.jsdelivr.net/npm/simple-datatables@9.0.0" defer></script>
          <script src="docs/assets/js/datatable-init.js" defer></script>
      - text: |
          <script>
          document.addEventListener("DOMContentLoaded", () => {
            const chapterTitle = document.querySelector("h1.web-chapter-title");
            if (chapterTitle) {
              const titleBlock = document.querySelector(".quarto-title-block");
              if (titleBlock) {
                titleBlock.style.display = "none";
              }

              const chapterNumber =
                chapterTitle.getAttribute("data-number") ||
                (chapterTitle.querySelector(".header-section-number") || {}).textContent?.trim();

              if (chapterNumber) {
                const prefixRegex = /^\s*표[\s\u00A0]*\d+(?:\.\d+)?[\s\u00A0]*:/;
                const tableCaptions = Array.from(
                  document.querySelectorAll("figcaption.quarto-float-tbl")
                );

                let tableIndex = 0;
                const tableIds = [];

                tableCaptions.forEach((caption) => {
                  tableIndex += 1;
                  const newPrefix = `표 ${chapterNumber}.${tableIndex}:`;
                  const walker = document.createTreeWalker(caption, NodeFilter.SHOW_TEXT, null);
                  const textNode = walker.nextNode();

                  if (textNode && prefixRegex.test(textNode.nodeValue)) {
                    textNode.nodeValue = textNode.nodeValue.replace(prefixRegex, newPrefix);
                  }

                  const float = caption.closest(".quarto-float");
                  if (float && float.id && float.id.startsWith("tbl-")) {
                    tableIds.push(float.id);
                  }
                });

                tableIds.forEach((id, idx) => {
                  const label = `표 ${chapterNumber}.${idx + 1}`;
                  document.querySelectorAll(`a[href="#${id}"]`).forEach((anchor) => {
                    const text = (anchor.textContent || "").trim();
                    if (/^표[\s\u00A0]*\d+(?:\.\d+)?$/.test(text)) {
                      anchor.textContent = label;
                    }
                  });
                });

                const figPrefixRegex = /^\s*그림[\s\u00A0]*\d+(?:\.\d+)?[\s\u00A0]*:/;
                const figCaptions = Array.from(
                  document.querySelectorAll("figure figcaption")
                ).filter((caption) => {
                  const figure = caption.closest("figure");
                  return !(figure && figure.classList.contains("quarto-float-tbl"));
                });
                let figIndex = 0;
                const figIds = [];

                figCaptions.forEach((caption) => {
                  figIndex += 1;
                  const newPrefix = `그림 ${chapterNumber}.${figIndex}:`;
                  const walker = document.createTreeWalker(caption, NodeFilter.SHOW_TEXT, null);
                  let textNode = walker.nextNode();
                  while (textNode && !textNode.nodeValue.trim()) {
                    textNode = walker.nextNode();
                  }

                  if (textNode) {
                    if (figPrefixRegex.test(textNode.nodeValue)) {
                      textNode.nodeValue = textNode.nodeValue.replace(figPrefixRegex, newPrefix);
                    } else {
                      textNode.nodeValue = `${newPrefix} ${textNode.nodeValue.trim()}`;
                    }
                  } else {
                    caption.prepend(document.createTextNode(`${newPrefix} `));
                  }

                  const float = caption.closest(".quarto-float");
                  if (float && float.id && float.id.startsWith("fig-")) {
                    figIds.push(float.id);
                  }
                });

                figIds.forEach((id, idx) => {
                  const label = `그림 ${chapterNumber}.${idx + 1}`;
                  document.querySelectorAll(`a[href="#${id}"]`).forEach((anchor) => {
                    const text = (anchor.textContent || "").trim();
                    if (/^그림[\s\u00A0]*\d+(?:\.\d+)?$/.test(text)) {
                      anchor.textContent = label;
                    }
                  });
                });
              }
            }

            document.querySelectorAll(".carousel-gallery").forEach((carousel) => {
              const track = carousel.querySelector(".carousel-track");
              const slides = Array.from(carousel.querySelectorAll(".carousel-slide"));
              if (!track || slides.length === 0) {
                return;
              }

              const dotsContainer = carousel.querySelector(".carousel-dots");
              const prevBtn = carousel.querySelector(".carousel-btn.prev");
              const nextBtn = carousel.querySelector(".carousel-btn.next");
              let currentIndex = 0;
              let isPointerDown = false;
              let isDragging = false;
              let startX = 0;
              let startY = 0;
              let dragStartTranslate = 0;
              let hasDragged = false;

              const getSlideWidth = () => {
                const styles = window.getComputedStyle(carousel);
                const paddingLeft = parseFloat(styles.paddingLeft) || 0;
                const paddingRight = parseFloat(styles.paddingRight) || 0;
                return carousel.clientWidth - paddingLeft - paddingRight;
              };

              const updateDots = () => {
                if (!dotsContainer) {
                  return;
                }
                dotsContainer.querySelectorAll(".carousel-dot").forEach((dot, idx) => {
                  dot.classList.toggle("is-active", idx === currentIndex);
                });
              };

              const update = () => {
                const width = getSlideWidth();
                slides.forEach((slide) => {
                  slide.style.width = `${width}px`;
                });
                track.style.transform = `translateX(-${currentIndex * width}px)`;
                updateDots();
              };

              const goTo = (index) => {
                currentIndex = (index + slides.length) % slides.length;
                update();
              };

              if (dotsContainer) {
                dotsContainer.innerHTML = "";
                slides.forEach((_, idx) => {
                  const dot = document.createElement("button");
                  dot.type = "button";
                  dot.className = "carousel-dot";
                  dot.setAttribute("aria-label", `슬라이드 ${idx + 1}`);
                  dot.addEventListener("click", () => goTo(idx));
                  dotsContainer.appendChild(dot);
                });
              }

              if (prevBtn) {
                prevBtn.addEventListener("click", () => goTo(currentIndex - 1));
              }
              if (nextBtn) {
                nextBtn.addEventListener("click", () => goTo(currentIndex + 1));
              }

              track.addEventListener("pointerdown", (event) => {
                if (event.button && event.button !== 0) {
                  return;
                }
                isPointerDown = true;
                isDragging = false;
                hasDragged = false;
                startX = event.clientX;
                startY = event.clientY;
                dragStartTranslate = -currentIndex * getSlideWidth();
              });

              track.addEventListener("pointermove", (event) => {
                if (!isPointerDown) {
                  return;
                }
                const deltaX = event.clientX - startX;
                const deltaY = event.clientY - startY;
                if (!isDragging) {
                  if (Math.abs(deltaX) > 12 && Math.abs(deltaX) > Math.abs(deltaY) + 4) {
                    isDragging = true;
                    hasDragged = true;
                    track.classList.add("is-dragging");
                    try {
                      track.setPointerCapture(event.pointerId);
                    } catch (error) {
                      // ignore if pointer capture fails
                    }
                  } else {
                    return;
                  }
                }
                track.style.transform = `translateX(${dragStartTranslate + deltaX}px)`;
              });

              const endDrag = (event) => {
                if (!isPointerDown) {
                  return;
                }
                isPointerDown = false;
                if (!isDragging) {
                  return;
                }
                isDragging = false;
                track.classList.remove("is-dragging");
                try {
                  track.releasePointerCapture(event.pointerId);
                } catch (error) {
                  // ignore if pointer was not captured
                }
                const delta = event.clientX - startX;
                const width = getSlideWidth();
                if (Math.abs(delta) > width * 0.2) {
                  goTo(delta < 0 ? currentIndex + 1 : currentIndex - 1);
                } else {
                  update();
                }
                if (hasDragged) {
                  track.dataset.dragging = "true";
                  window.setTimeout(() => {
                    track.dataset.dragging = "false";
                  }, 0);
                }
              };

              track.addEventListener("pointerup", endDrag);
              track.addEventListener("pointercancel", endDrag);

              track.addEventListener("click", (event) => {
                if (track.dataset.dragging === "true") {
                  event.preventDefault();
                  event.stopPropagation();
                }
              });

              window.addEventListener("resize", update);
              update();
            });

            const initLightboxSwipe = () => {
              const supportsFinePointer = window.matchMedia("(pointer: fine)").matches;
              if (!supportsFinePointer) {
                return;
              }

              const container = document.querySelector(".glightbox-container");
              if (!container || container.dataset.swipeInit === "true") {
                return;
              }
              container.dataset.swipeInit = "true";

              const slider = container.querySelector("#glightbox-slider");
              if (!slider) {
                return;
              }

              let isPointerDown = false;
              let isDragging = false;
              let hasDragged = false;
              let startX = 0;
              let startY = 0;

              const isZoomed = () => {
                const active = slider.querySelector(".gslide.current");
                return active && active.classList.contains("zoomed");
              };

              const goNext = () => {
                const nextBtn = container.querySelector(".gnext");
                if (nextBtn && !nextBtn.classList.contains("disabled")) {
                  nextBtn.click();
                }
              };

              const goPrev = () => {
                const prevBtn = container.querySelector(".gprev");
                if (prevBtn && !prevBtn.classList.contains("disabled")) {
                  prevBtn.click();
                }
              };

              slider.addEventListener("pointerdown", (event) => {
                if (event.button && event.button !== 0) {
                  return;
                }
                if (isZoomed()) {
                  return;
                }
                if (event.target.closest(".gbtn")) {
                  return;
                }
                isPointerDown = true;
                isDragging = false;
                hasDragged = false;
                startX = event.clientX;
                startY = event.clientY;
              });

              slider.addEventListener("pointermove", (event) => {
                if (!isPointerDown) {
                  return;
                }
                const deltaX = event.clientX - startX;
                const deltaY = event.clientY - startY;
                if (!isDragging) {
                  if (Math.abs(deltaX) > 12 && Math.abs(deltaX) > Math.abs(deltaY) + 4) {
                    isDragging = true;
                    hasDragged = true;
                    slider.classList.add("is-dragging");
                    try {
                      slider.setPointerCapture(event.pointerId);
                    } catch (error) {
                      // ignore if pointer capture fails
                    }
                  } else {
                    return;
                  }
                }
              });

              const endDrag = (event) => {
                if (!isPointerDown) {
                  return;
                }
                isPointerDown = false;
                if (!isDragging) {
                  return;
                }
                isDragging = false;
                slider.classList.remove("is-dragging");
                try {
                  slider.releasePointerCapture(event.pointerId);
                } catch (error) {
                  // ignore if pointer was not captured
                }

                const deltaX = event.clientX - startX;
                const deltaY = event.clientY - startY;
                if (
                  hasDragged &&
                  Math.abs(deltaX) > Math.abs(deltaY) &&
                  Math.abs(deltaX) > 50
                ) {
                  if (deltaX < 0) {
                    goNext();
                  } else {
                    goPrev();
                  }
                }

                if (hasDragged) {
                  slider.dataset.dragging = "true";
                  window.setTimeout(() => {
                    slider.dataset.dragging = "false";
                  }, 0);
                }
              };

              slider.addEventListener("pointerup", endDrag);
              slider.addEventListener("pointercancel", endDrag);

              slider.addEventListener("click", (event) => {
                if (slider.dataset.dragging === "true") {
                  event.preventDefault();
                  event.stopPropagation();
                }
              });
            };

            initLightboxSwipe();
            const lightboxObserver = new MutationObserver(() => initLightboxSwipe());
            lightboxObserver.observe(document.body, { childList: true, subtree: true });
          });
          </script>
