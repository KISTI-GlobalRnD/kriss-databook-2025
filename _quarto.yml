project:
  type: website
  output-dir: _site_website
  render:
    - index.qmd
    - docs/*.qmd
    - "!docs/final_report_*.qmd"
  resources:
    - docs/assets/**
    - "Final_Report_MD/최종보고서 내용/*.png"
    - "Final_Report_MD/최종보고서 내용/*.xlsx"
    - theme/**

website:
  title: "KRISS Keyword Pipeline Report"
  description: "Final report and operational handbook for the KRISS standard-research analytics program"
  repo-url: https://github.com/kimyoungjin06/final-report-placeholder
  repo-actions: [source, issue]
  sidebar:
    style: floating
    search: true
    border: true
    collapse-level: 2
    tools:
      - icon: book
        text: "북 버전 보기"
        href: "https://kisti-globalrnd.github.io/kriss-databook-2025/book/"
      - icon: browser
        text: "웹 버전 홈"
        href: "https://kisti-globalrnd.github.io/kriss-databook-2025/website/"
    contents:
      - text: "홈 / Home"
        href: index.qmd
      - text: "작성 가이드 / Authoring Notes"
        href: docs/authoring_notes.qmd
      - section: "최종보고서 / Final Report"
        contents:
          - docs/report_00_preface.qmd
          - docs/report_1_1_data_build.qmd
          - docs/report_1_2_1_global_landscape.qmd
          - docs/report_1_2_2_leiden_clustering.qmd
          - docs/report_1_2_3_kriss_division_mapping.qmd
