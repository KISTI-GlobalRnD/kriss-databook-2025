project:
  type: website
  output-dir: _site_website
  render:
    - index.qmd
    - docs/report_*.qmd
    - docs/keyword_trends.qmd
    - docs/vosviewer_explorer.qmd
    - docs/appendix_detailed_reporting.qmd
    - docs/detailed_reports/*/report.qmd
    - docs/appendix.qmd
  resources:
    - docs/assets/**
    - "Final_Report_MD/최종보고서 내용/*.png"
    - "Final_Report_MD/최종보고서 내용/*.xlsx"
    - theme/**

website:
  title: "KRISS 표준과학 연구 데이터북 (Databook)"
  description: "Curated report with lightweight interactive tools for monitoring the standard-science research landscape"
  repo-url: https://github.com/kimyoungjin06/final-report-placeholder
  repo-actions: [source, issue]
  sidebar:
    style: floating
    search: true
    border: true
    collapse-level: 2
    tools:
      - icon: book
        text: "북 버전 보기"
        href: "https://kisti-globalrnd.github.io/kriss-databook-2025/book/"
      - icon: browser
        text: "웹 버전 홈"
        href: "https://kisti-globalrnd.github.io/kriss-databook-2025/website/"
    contents:
      - text: "홈 / Home"
        href: index.qmd
      - section: "데이터북 / Databook"
        contents:
          - docs/report_00_preface.qmd
          - docs/report_1_1_data_build.qmd
          - docs/report_1_2_1_global_landscape.qmd
          - docs/report_1_2_2_leiden_clustering.qmd
          - docs/report_1_2_3_kriss_division_mapping.qmd
          - docs/report_1_2_4_keywords_timeseries.qmd
          - docs/report_1_2_5_landscape_visualization.qmd
          - docs/report_2_1_org_country_standardization.qmd
          - docs/report_2_2_benchmark_institutions.qmd
          - docs/report_2_3_collaboration_network.qmd
          - docs/report_2_4_1_country_performance.qmd
          - docs/report_2_4_2_institution_performance.qmd
          - docs/report_2_4_3_policy_alignment.qmd
          - docs/report_3_1_portfolio_capability.qmd
          - docs/report_3_2_emerging_candidates.qmd
          - docs/report_3_3_1_emergence_indicators.qmd
          - docs/report_3_3_2_emergence_scoring.qmd
          - docs/report_3_4_databook_dashboard.qmd
          - docs/report_3_5_llm_reporting.qmd
      - section: "인터랙티브 도구 / Tools"
        contents:
          - docs/keyword_trends.qmd
          - docs/vosviewer_explorer.qmd
          - text: "클러스터 대시보드 (Shiny)"
            href: "https://road2you.shinyapps.io/kriss_cluster_dashboard/"
      - section: "부록 / Appendix"
        contents:
          - docs/appendix_detailed_reporting.qmd
          - text: "상세 리포트(핵심 역량) — 20-182"
            href: docs/detailed_reports/cluster_182/report.qmd
          - text: "상세 리포트(확장 가능) — 38-84"
            href: docs/detailed_reports/cluster_84/report.qmd
          - text: "상세 리포트(역량 공백) — 11-159"
            href: docs/detailed_reports/cluster_159/report.qmd
          - docs/appendix.qmd
  navbar:
    left:
      - text: "데이터북 / Databook"
        menu:
          - text: "서문 / Preface"
            href: docs/report_00_preface.qmd
          - text: "---"
          - text: "1-1) 문헌 데이터 구축"
            href: docs/report_1_1_data_build.qmd
          - text: "1-2-1) 글로벌 연구지형도"
            href: docs/report_1_2_1_global_landscape.qmd
          - text: "1-2-2) 표준과학 연구지형도(Leiden)"
            href: docs/report_1_2_2_leiden_clustering.qmd
          - text: "1-2-3) KRISS 4대 분야 매핑"
            href: docs/report_1_2_3_kriss_division_mapping.qmd
          - text: "1-2-4) 클러스터 기반 키워드/시계열"
            href: docs/report_1_2_4_keywords_timeseries.qmd
          - text: "1-2-5) 연구지형도 시각화"
            href: docs/report_1_2_5_landscape_visualization.qmd
          - text: "---"
          - text: "2-1) 국가/기관 표준화"
            href: docs/report_2_1_org_country_standardization.qmd
          - text: "2-2) 벤치마킹 기관"
            href: docs/report_2_2_benchmark_institutions.qmd
          - text: "2-3) 협력 네트워크"
            href: docs/report_2_3_collaboration_network.qmd
          - text: "2-4-1) 국가 성과"
            href: docs/report_2_4_1_country_performance.qmd
          - text: "2-4-2) 기관 성과"
            href: docs/report_2_4_2_institution_performance.qmd
          - text: "2-4-3) 정책 정렬"
            href: docs/report_2_4_3_policy_alignment.qmd
          - text: "---"
          - text: "3-1) 포트폴리오 역량"
            href: docs/report_3_1_portfolio_capability.qmd
          - text: "3-2) 유망 후보"
            href: docs/report_3_2_emerging_candidates.qmd
          - text: "3-3-1) Emergence 지표"
            href: docs/report_3_3_1_emergence_indicators.qmd
          - text: "3-3-2) Emergence scoring"
            href: docs/report_3_3_2_emergence_scoring.qmd
          - text: "3-4) Databook dashboard"
            href: docs/report_3_4_databook_dashboard.qmd
          - text: "3-5) LLM reporting"
            href: docs/report_3_5_llm_reporting.qmd
      - text: "인터랙티브 도구 / Tools"
        menu:
          - text: "키워드 추세 탐색기 / Keyword Trends"
            href: docs/keyword_trends.qmd
          - text: "연구지형도(인터랙티브 맵) / VOSviewer"
            href: docs/vosviewer_explorer.qmd
          - text: "클러스터 대시보드 (Shiny)"
            href: "https://road2you.shinyapps.io/kriss_cluster_dashboard/"
      - text: "부록 / Appendix"
        menu:
          - text: "상세 리포팅(예정) / Detailed Reporting"
            href: docs/appendix_detailed_reporting.qmd
          - text: "Appendix"
            href: docs/appendix.qmd
  page-navigation: true

language:
  section-title-footnotes: "각주"
  section-title-references: "참고문헌"

crossref:
  fig-title: "그림"
  tbl-title: "표"
  fig-prefix: 그림
  tbl-prefix: 표
  ref-hyperlink: true

format:
  html:
    theme: [cosmo, theme/my_theme.scss]
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    anchor-sections: true
