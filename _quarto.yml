language:
  section-title-footnotes: "각주"
  section-title-references: "참고문헌"

crossref:
  fig-title: "그림"
  tbl-title: "표"
  fig-prefix: 그림
  tbl-prefix: 표
  ref-hyperlink: true

format:
  html:
    theme: [cosmo, theme/my_theme.scss]
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    anchor-sections: true
